name: Compilar para Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm test
      - run: npm run dist

      - name: Empaquetar la extensión de Chrome
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath dist/YT-Flotante-Extension-Chrome.zip

      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: YT-Flotante-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.zip

      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.zip
